[package]
name = "frontier"
version = "0.1.0"
edition = "2021"
description = "Frontier: Elite II — Rust client (software framebuffer)"

[dependencies]
frontier-sim = { path = "../frontier-sim" }
glam = "0.29"
winit = "0.30"
pixels = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
fontdue = "0.9"
serde_json = "1"
env_logger = "0.11"
log = "0.4"
rodio = { version = "0.19", features = ["mp3"] }

[build-dependencies]
winresource = "0.1"
