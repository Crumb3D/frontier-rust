[package]
name = "frontier-sim"
version = "0.1.0"
edition = "2021"
description = "Pure Frontier: Elite II simulation (no window)"

[dependencies]
glam = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8", features = ["std_rng"] }

[dev-dependencies]
approx = "0.5"
